<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ジャンプ！タイミングゲーム</title>
  <style>
    /* ===========================
       グローバルスタイル
    =========================== */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: linear-gradient(135deg, #a18cd1 0%, #fbc2eb 100%);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      overflow: hidden;
      font-family: 'Segoe UI', 'Arial Rounded MT Bold', Arial, sans-serif;
    }

    /* キャンバスのラッパー */
    #wrapper {
      position: relative;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    /* ゲームキャンバス本体 */
    canvas {
      display: block;
      border-radius: 20px;
      box-shadow: 0 24px 64px rgba(0, 0, 0, 0.35);
      /* タッチ時の長押しメニューを無効化 */
      -webkit-touch-callout: none;
      user-select: none;
    }
  </style>
</head>
<body>
<div id="wrapper">
  <canvas id="gameCanvas"></canvas>
</div>

<script>
/* =====================================================
   🎮 ゲームパラメータ ─ ここで値を調整できます
   ===================================================== */
const CFG = {
  /* ── キャンバス ── */
  W: 800,             // キャンバス幅 (px)
  H: 420,             // キャンバス高さ (px)

  /* ── プレイヤー ── */
  PLAYER_X: 110,      // プレイヤーの固定X座標
  PLAYER_SIZE: 52,    // プレイヤーの描画サイズ
  JUMP_FORCE: -15,    // ジャンプ初速（マイナスが上方向）
  GRAVITY: 0.65,      // 重力加速度（大きいほど重くなる）
  MAX_FALL: 16,       // 最大落下速度
  PLAYER_MAX_JUMPS: 2, // ジャンプ可能な総回数（1=シングル、2=ダブルジャンプ）

  /* ── 地面 ── */
  GROUND_H: 72,       // 地面の高さ

  /* ── 障害物（地面系）── */
  OBS_W: 52,          // 障害物の幅
  OBS_MIN_H: 45,      // 障害物の最小高さ
  OBS_MAX_H: 120,     // ノーマル障害物の最大高さ（小ジャンプで越えられる）
  OBS_TALL_H: 155,    // トール障害物の最大高さ（最大ジャンプ高さ181px以内・余裕30px確保）
  OBS_MIN_GAP_F: 80,  // 障害物の最小出現間隔（フレーム数）── ジャンプ46F＋余裕
  OBS_MAX_GAP_F: 140, // 障害物の最大出現間隔（フレーム数）
  FIRST_OBS: 320,     // 最初の障害物が出るまでの距離

  /* ── 障害物（フライング系）── */
  FLY_H: 44,          // フライング障害物の高さ
  FLY_Y_MIN: 90,      // フライング障害物の上端Y最小値（キャンバス上端から）
  FLY_Y_MAX: 200,     // フライング障害物の上端Y最大値（上端200+高さ44=下端244 < 地面プレイヤー判定306）
  /* FLY_Y_MAX+FLY_H=244 < プレイヤー地上ヒットボックス上端306 → 地面走行時は絶対に当たらない */
  FLY_AFTER_GND_GAP_F: 110, // 地面系→フライング時の最小間隔（着地後の反応時間を十分確保）

  /* ── 速度 ── */
  SPEED_INIT: 4.2,    // 初期スクロール速度
  SPEED_MAX: 13,      // 最大スクロール速度
  SPEED_INC: 0.0012,  // フレームごとの速度増加量

  /* ── スコア ── */
  SCORE_RATE: 0.12,   // フレームごとのスコア加算量

  /* ── パーティクル ── */
  JUMP_PTCL: 12,      // ジャンプ時のパーティクル数
  DIE_PTCL: 35,       // ゲームオーバー時のパーティクル数

  /* ── カラーパレット（ポップ！） ── */
  SKY_TOP:    '#c9f0ff', // 空グラデーション上
  SKY_BTM:    '#fff6e6', // 空グラデーション下
  GROUND_TOP: '#6dcc52', // 地面上部（芝生）
  GROUND_BOT: '#4a9a30', // 地面下部
  GROUND_LINE:'#3a7a22', // 地面境界線
  CLOUD_CLR:  'rgba(255,255,255,0.85)', // 雲の色

  /* 障害物カラーリスト */
  OBS_COLORS: ['#ff6b6b','#ff9f43','#a29bfe','#00cec9','#fd79a8','#6c5ce7'],
  /* フライング障害物専用カラー（青紫系） */
  FLY_COLORS: ['#a29bfe','#6c5ce7','#74b9ff','#0984e3','#fd79a8'],

  /* ── アイテム ── */
  COIN_SCORE:     500,   // コイン取得スコア
  STAR_DURATION:  300,   // 無敵フレーム数（5秒 @ 60fps）
  ITEM_SIZE:       36,   // アイテム絵文字の描画サイズ
  ITEM_MIN_GAP_F: 150,   // アイテム出現最小間隔（フレーム数）
  ITEM_MAX_GAP_F: 260,   // アイテム出現最大間隔（フレーム数）
  ITEM_MIN_H:      55,   // 地面からの最小浮遊高さ (px)
  ITEM_MAX_H:     165,   // 地面からの最大浮遊高さ (px)
  ITEM_OBS_CLEAR:  80,   // 障害物との最小X距離（重複防止 px）
  ITEM_FLY_BUFFER: 15,   // フライング障害物とのY余白（重複防止 px）
};

/* =====================================================
   キャンバスのセットアップ・レスポンシブ対応
   ===================================================== */
const canvas = document.getElementById('gameCanvas');
const ctx    = canvas.getContext('2d');
canvas.width  = CFG.W;
canvas.height = CFG.H;

function resizeCanvas() {
  const maxW = Math.min(window.innerWidth - 16, CFG.W);
  const scale = maxW / CFG.W;
  canvas.style.width  = `${CFG.W * scale}px`;
  canvas.style.height = `${CFG.H * scale}px`;
}
resizeCanvas();
window.addEventListener('resize', resizeCanvas);

/* =====================================================
   ゲーム状態
   ===================================================== */
const STATE = { TITLE: 0, PLAYING: 1, OVER: 2 };
let state      = STATE.TITLE;
let score      = 0;
let best       = parseInt(localStorage.getItem('jtg_best') || '0');
let speed      = CFG.SPEED_INIT;
let frame      = 0;         // フレームカウンター（アニメーション用）
let bgOfs      = 0;         // 地面スクロールオフセット
let nextObsDist = CFG.FIRST_OBS; // 次の障害物までの距離カウンター
let lastObsType = 'normal'; // 直前の障害物タイプ（gap計算の公平性チェック用）
let items          = [];          // アイテム配列
let nextItemDist   = 0;           // 次のアイテムまでの距離カウンター
let invincibleFrames = 0;         // 無敵残りフレーム数（0=通常）
let textPopups     = [];          // アイテム取得テキストポップアップ

/* =====================================================
   プレイヤーオブジェクト
   ===================================================== */
const player = {
  x: CFG.PLAYER_X,
  y: 0,
  w: CFG.PLAYER_SIZE,
  h: CFG.PLAYER_SIZE,
  vy: 0,
  onGround: true,
  jumpCount: 0,    // 現在の連続ジャンプ回数（着地でリセット）

  /* 地面Y座標 */
  get groundY() {
    return CFG.H - CFG.GROUND_H - this.h;
  },

  reset() {
    this.y = this.groundY;
    this.vy = 0;
    this.onGround = true;
    this.jumpCount = 0;
  },

  jump() {
    /* jumpCount が上限に達していたらスキップ（isGrounded は条件に使わない）  */
    /* → 地面では jumpCount===0 なので必ず通過、空中では jumpCount で上限管理  */
    if (this.jumpCount >= CFG.PLAYER_MAX_JUMPS) return;
    this.vy = CFG.JUMP_FORCE;   // プロジェクト規約: Y速度は this.vy で管理
    this.onGround = false;
    this.jumpCount++;
    spawnJumpParticles(this.x + this.w / 2, this.y + this.h);
  },

  update() {
    this.vy = Math.min(this.vy + CFG.GRAVITY, CFG.MAX_FALL);
    this.y += this.vy;
    if (this.y >= this.groundY) {
      this.y = this.groundY;
      this.vy = 0;
      this.onGround = true;
      this.jumpCount = 0; // 着地でリセット（onLand 相当）
    }
  },

  /* 当たり判定用ヒットボックス（見た目より少し小さめ） */
  hitbox() {
    const m = 10;
    return { x: this.x + m, y: this.y + m, w: this.w - m*2, h: this.h - m*2 };
  },

  draw() {
    ctx.save();

    /* ジャンプ中は少し回転してポップな動きを演出 */
    const rot = this.onGround ? 0 : Math.sin(frame * 0.18) * 0.22;

    /* 着地影 */
    const shadowAlpha = this.onGround ? 0.25 : Math.max(0, 0.18 - (this.groundY - this.y) * 0.001);
    const shadowScale = this.onGround ? 1 : Math.max(0.4, 1 - (this.groundY - this.y) * 0.006);
    ctx.save();
    ctx.globalAlpha = shadowAlpha;
    ctx.fillStyle = '#000';
    ctx.scale(1, 0.3);
    ctx.beginPath();
    ctx.ellipse(
      this.x + this.w / 2,
      (this.groundY + this.h) / 0.3 + 4,
      (this.w / 2.2) * shadowScale,
      6,
      0, 0, Math.PI * 2
    );
    ctx.fill();
    ctx.restore();

    /* 無敵オーラ（虹色ラジアルグラデーション・絵文字の後ろに描画） */
    if (invincibleFrames > 0) {
      const cx  = this.x + this.w / 2;
      const cy  = this.y + this.h / 2;
      const r   = this.w * 0.75;
      const hue = (frame * 6) % 360;
      const grd = ctx.createRadialGradient(cx, cy, r * 0.25, cx, cy, r);
      grd.addColorStop(0,   `hsla(${hue},              100%, 70%, 0.6)`);
      grd.addColorStop(0.5, `hsla(${(hue + 120) % 360},100%, 65%, 0.35)`);
      grd.addColorStop(1,   `hsla(${(hue + 240) % 360},100%, 60%, 0)`);
      ctx.save();
      ctx.beginPath();
      ctx.arc(cx, cy, r, 0, Math.PI * 2);
      ctx.fillStyle = grd;
      ctx.fill();
      ctx.restore();
    }

    /* プレイヤー絵文字（無敵中は点滅） */
    /* 通常: 4フレーム周期、残り60F以下は2フレーム周期で警告点滅 */
    const blinkRate = invincibleFrames > 60 ? 4 : 2;
    const blink     = invincibleFrames > 0 && (frame % blinkRate < Math.floor(blinkRate / 2));
    if (!blink) {
      ctx.translate(this.x + this.w / 2, this.y + this.h / 2);
      ctx.rotate(rot);
      ctx.font = `${CFG.PLAYER_SIZE}px serif`;
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText('🐥', 0, 0);
    }

    ctx.restore();
  },
};

/* =====================================================
   障害物管理
   ===================================================== */
let obstacles = [];

/*
 * 障害物タイプの抽選
 * 'normal' 35% / 'tall' 25% / 'flying' 40%
 */
function pickObsType() {
  const r = Math.random();
  if (r < 0.35) return 'normal';
  if (r < 0.60) return 'tall';
  return 'flying';
}

/*
 * タイプの組み合わせによる最小ギャップフレーム数を返す
 *
 * 【公平性ルール】
 * ・地面系（normal/tall）→ フライング の場合:
 *   プレイヤーはジャンプを強いられた直後にフライングが来るため、
 *   着地後に「ジャンプしてはいけない」と判断できる十分な時間を確保する。
 *   最小 FLY_AFTER_GND_GAP_F(90) フレーム = 着地(46F) + 反応時間(44F)
 *
 * ・その他の組み合わせ: 通常の OBS_MIN_GAP_F(65) フレーム
 */
function obsMinGapF(prevType, nextType) {
  const isGnd = t => t === 'normal' || t === 'tall';
  if (isGnd(prevType) && nextType === 'flying') return CFG.FLY_AFTER_GND_GAP_F;
  return CFG.OBS_MIN_GAP_F;
}

/*
 * 指定タイプの障害物をスポーン
 *
 * 地面系: groundY から上へ伸びる矩形
 * フライング: 空中に浮かぶ矩形（地面走行中はプレイヤーヒットボックスと非交差）
 *   → FLY_Y_MAX + FLY_H = 200 + 44 = 244 < プレイヤー地上ヒットボックス上端(306)
 *      なので地面を走り続ければ絶対に当たらない
 */
function spawnObstacle(type) {
  const obs = {
    x:      CFG.W + 60,
    w:      CFG.OBS_W,
    passed: false,
    phase:  Math.random() * Math.PI * 2,
    type,
  };

  if (type === 'flying') {
    obs.y     = CFG.FLY_Y_MIN + Math.random() * (CFG.FLY_Y_MAX - CFG.FLY_Y_MIN);
    obs.h     = CFG.FLY_H;
    obs.color = CFG.FLY_COLORS[Math.floor(Math.random() * CFG.FLY_COLORS.length)];
    obs.emoji = '🛸';
  } else if (type === 'tall') {
    const h   = CFG.OBS_MIN_H + Math.random() * (CFG.OBS_TALL_H - CFG.OBS_MIN_H);
    obs.y     = CFG.H - CFG.GROUND_H - h;
    obs.h     = h;
    obs.color = CFG.OBS_COLORS[Math.floor(Math.random() * CFG.OBS_COLORS.length)];
    obs.emoji = '🧱';
  } else {
    const h   = CFG.OBS_MIN_H + Math.random() * (CFG.OBS_MAX_H - CFG.OBS_MIN_H);
    obs.y     = CFG.H - CFG.GROUND_H - h;
    obs.h     = h;
    obs.color = CFG.OBS_COLORS[Math.floor(Math.random() * CFG.OBS_COLORS.length)];
    obs.emoji = Math.random() < 0.5 ? '📦' : '🪨';
  }

  obstacles.push(obs);
}

function updateObstacles() {
  for (let i = obstacles.length - 1; i >= 0; i--) {
    const o = obstacles[i];
    o.x -= speed;
    /* フライングは緩やかに浮遊、地面系はポップに揺れる */
    o.phase += o.type === 'flying' ? 0.04 : 0.06;

    /* 画面外に出たら削除 */
    if (o.x + o.w < 0) { obstacles.splice(i, 1); continue; }

    /* プレイヤーを通過したらスコア加算 */
    if (!o.passed && o.x + o.w < player.x) {
      o.passed = true;
      spawnScorePopup(player.x + player.w + 5, player.y - 5);
    }
  }

  /* 新しい障害物の出現タイミング */
  nextObsDist -= speed;
  if (nextObsDist <= 0) {
    const newType   = pickObsType();
    const minGap    = obsMinGapF(lastObsType, newType);
    spawnObstacle(newType);
    lastObsType = newType;
    /* gapFrames * speed → ピクセル距離はスピードに比例して広がる（時間的余裕は一定） */
    const gapFrames = minGap + Math.random() * (CFG.OBS_MAX_GAP_F - minGap);
    nextObsDist = gapFrames * speed;
  }
}

/* ─── 地面系障害物の描画（📦 ノーマル・🧱 トール）─── */
function drawGroundObstacle(o) {
  const wobble = Math.sin(o.phase) * 2;

  /* 影 */
  ctx.globalAlpha = 0.18;
  ctx.fillStyle = '#000';
  fillRoundRect(o.x + 5, o.y + 8 + wobble, o.w, o.h, 10);
  ctx.globalAlpha = 1;

  /* 本体 */
  ctx.fillStyle = o.color;
  fillRoundRect(o.x, o.y + wobble, o.w, o.h, 10);

  /* ハイライト */
  ctx.fillStyle = 'rgba(255,255,255,0.35)';
  fillRoundRect(o.x + 5, o.y + 5 + wobble, o.w - 10, o.h * 0.28, 7);

  /* 🧱 トール専用: レンガ模様（横線＋交互の縦線） */
  if (o.type === 'tall') {
    ctx.fillStyle = 'rgba(0,0,0,0.14)';
    const brickH = 18;
    for (let row = 0; row * brickH < o.h - 4; row++) {
      const ry     = o.y + wobble + row * brickH;
      const offset = row % 2 === 0 ? 0 : o.w * 0.5;
      /* 水平の目地 */
      ctx.fillRect(o.x + 2, ry, o.w - 4, 2);
      /* 垂直の目地（千鳥配置） */
      ctx.fillRect(o.x + offset + o.w * 0.5 - 1, ry + 2, 2, brickH - 2);
    }
  }

  /* 絵文字アイコン */
  ctx.font = '28px serif';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText(o.emoji, o.x + o.w / 2, o.y + o.h / 2 + wobble);
}

/* ─── フライング障害物の描画（🛸 UFO）─── */
function drawFlyingObstacle(o) {
  const bob     = Math.sin(o.phase) * 5; // 浮遊アップダウン
  const cx      = o.x + o.w / 2;
  const groundY = CFG.H - CFG.GROUND_H;

  /* 引力ビーム（UFO → 地面へのグラデーションビーム） */
  ctx.save();
  ctx.globalAlpha = 0.10;
  const beamW = o.w * 0.7;
  const beam  = ctx.createLinearGradient(cx, o.y + o.h + bob, cx, groundY);
  beam.addColorStop(0, o.color);
  beam.addColorStop(1, 'rgba(0,0,0,0)');
  ctx.fillStyle = beam;
  ctx.beginPath();
  ctx.moveTo(cx - beamW / 2,     o.y + o.h + bob);
  ctx.lineTo(cx + beamW / 2,     o.y + o.h + bob);
  ctx.lineTo(cx + beamW * 1.15,  groundY);
  ctx.lineTo(cx - beamW * 1.15,  groundY);
  ctx.closePath();
  ctx.fill();
  ctx.restore();

  /* 本体グロー */
  ctx.save();
  ctx.shadowColor = o.color;
  ctx.shadowBlur  = 20;

  /* 本体 */
  ctx.fillStyle = o.color;
  fillRoundRect(o.x, o.y + bob, o.w, o.h, 10);

  ctx.shadowBlur = 0;

  /* ハイライト */
  ctx.fillStyle = 'rgba(255,255,255,0.42)';
  fillRoundRect(o.x + 5, o.y + 5 + bob, o.w - 10, o.h * 0.30, 7);

  /* 絵文字 */
  ctx.font = '28px serif';
  ctx.textAlign    = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText(o.emoji, cx, o.y + o.h / 2 + bob);

  ctx.restore();
}

function drawObstacles() {
  obstacles.forEach(o => {
    ctx.save();
    if (o.type === 'flying') drawFlyingObstacle(o);
    else drawGroundObstacle(o);
    ctx.restore();
  });
}

/* =====================================================
   アイテム管理
   ===================================================== */
function spawnItem() {
  /* 障害物がスポーン地点付近（±ITEM_OBS_CLEAR）にいれば短時間遅延して再試行 */
  const spawnX = CFG.W + 60;
  for (const o of obstacles) {
    if (Math.abs(o.x - spawnX) < CFG.ITEM_OBS_CLEAR) {
      nextItemDist = 30; // ~30フレーム後に再試行
      return;
    }
  }

  /* コイン65% / スター35% */
  const type    = Math.random() < 0.65 ? 'coin' : 'star';
  const groundY = CFG.H - CFG.GROUND_H;

  /*
   * フライング障害物との Y 重複を防ぐ（最大5回試行）
   * 近傍（X距離300px以内）のフライング障害物とY範囲が被らない高さを選ぶ。
   * 5回試みて解消できない場合は最低高さで強制スポーン（地面寄りになりフライングとは重ならない）。
   */
  let floatH = CFG.ITEM_MIN_H + Math.random() * (CFG.ITEM_MAX_H - CFG.ITEM_MIN_H);
  let itemY   = groundY - floatH - CFG.ITEM_SIZE;

  for (let attempt = 0; attempt < 5; attempt++) {
    const itemBottom = itemY + CFG.ITEM_SIZE;
    let hasYOverlap  = false;

    for (const o of obstacles) {
      if (o.type !== 'flying') continue;
      if (Math.abs(o.x - spawnX) > 300) continue; // 遠い障害物は無視
      const buf = CFG.ITEM_FLY_BUFFER;
      if (itemY < o.y + o.h + buf && itemBottom > o.y - buf) {
        hasYOverlap = true;
        break;
      }
    }

    if (!hasYOverlap) break;

    /* 重複していれば再抽選（より地面に近い高さ優先） */
    floatH = CFG.ITEM_MIN_H + Math.random() * (CFG.ITEM_MAX_H - CFG.ITEM_MIN_H) * 0.5;
    itemY  = groundY - floatH - CFG.ITEM_SIZE;
  }

  items.push({
    x:     spawnX,
    y:     itemY,
    w:     CFG.ITEM_SIZE,
    h:     CFG.ITEM_SIZE,
    type,
    emoji: type === 'coin' ? '🪙' : '🌟',
    phase: Math.random() * Math.PI * 2, // 浮遊アニメーション位相
  });
}

function updateItems() {
  /* スポーンタイミング */
  nextItemDist -= speed;
  if (nextItemDist <= 0) {
    spawnItem();
    const gapFrames = CFG.ITEM_MIN_GAP_F + Math.random() * (CFG.ITEM_MAX_GAP_F - CFG.ITEM_MIN_GAP_F);
    nextItemDist = gapFrames * speed;
  }

  const p = player.hitbox();
  for (let i = items.length - 1; i >= 0; i--) {
    const it = items[i];
    it.x    -= speed;
    it.phase += 0.07;

    /* 画面外削除 */
    if (it.x + it.w < 0) { items.splice(i, 1); continue; }

    /* プレイヤーとのAABB衝突 */
    if (p.x < it.x + it.w && p.x + p.w > it.x &&
        p.y < it.y + it.h && p.y + p.h > it.y) {
      collectItem(it, i);
    }
  }
}

function collectItem(item, index) {
  items.splice(index, 1);
  const cx = item.x + item.w / 2;
  const cy = item.y + item.h / 2;

  if (item.type === 'coin') {
    score += CFG.COIN_SCORE;
    spawnTextPopup(player.x + player.w / 2, player.y - 8, '+500!', '#ffd700');
    spawnCollectBurst(cx, cy, '#ffd700');
  } else {
    invincibleFrames = CFG.STAR_DURATION;
    spawnTextPopup(player.x + player.w / 2, player.y - 8, '無敵！', '#c084fc');
    spawnCollectBurst(cx, cy, '#c084fc');
  }
}

function drawItems() {
  items.forEach(it => {
    const bob = Math.sin(it.phase) * 5;
    const cx  = it.x + it.w / 2;
    const cy  = it.y + it.h / 2 + bob;

    ctx.save();
    ctx.shadowColor = it.type === 'coin' ? 'rgba(255,215,0,0.8)' : 'rgba(192,132,252,0.8)';
    ctx.shadowBlur  = 18;
    ctx.font        = `${CFG.ITEM_SIZE}px serif`;
    ctx.textAlign   = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(it.emoji, cx, cy);
    ctx.restore();
  });
}

/* =====================================================
   衝突判定（AABB）
   ===================================================== */
function checkCollision() {
  if (invincibleFrames > 0) return false; // 無敵中は障害物をすり抜ける
  const p = player.hitbox();
  for (const o of obstacles) {
    /*
     * フライング障害物はヒットボックスを6px内側に縮小して多少フォーギビング（視認難易度補正）
     * 地面系障害物は従来通りフルサイズ
     */
    const margin = o.type === 'flying' ? 6 : 0;
    const ox = o.x + margin;
    const oy = o.y + margin;
    const ow = o.w - margin * 2;
    const oh = o.h - margin * 2;

    if (p.x < ox + ow && p.x + p.w > ox &&
        p.y < oy + oh && p.y + p.h > oy) return true;
  }
  return false;
}

/* =====================================================
   パーティクルシステム
   ===================================================== */
let particles  = [];
let scorePopups = [];

/* ジャンプ時の地面パーティクル */
function spawnJumpParticles(x, y) {
  for (let i = 0; i < CFG.JUMP_PTCL; i++) {
    particles.push({
      x, y,
      vx: (Math.random() - 0.5) * 5,
      vy: -Math.random() * 3.5 - 0.5,
      r:  Math.random() * 7 + 3,
      color: `hsl(${Math.random() * 50 + 30},100%,65%)`,
      life: 1,
    });
  }
}

/* ゲームオーバー時の爆発パーティクル */
function spawnDeathParticles(x, y) {
  for (let i = 0; i < CFG.DIE_PTCL; i++) {
    const angle = (Math.PI * 2 / CFG.DIE_PTCL) * i + Math.random() * 0.5;
    const spd   = Math.random() * 6 + 2;
    particles.push({
      x, y,
      vx: Math.cos(angle) * spd,
      vy: Math.sin(angle) * spd - 3,
      r:  Math.random() * 10 + 4,
      color: `hsl(${Math.random() * 360},100%,60%)`,
      life: 1,
    });
  }
}

/* スコアポップアップ（+1 が浮かぶ） */
function spawnScorePopup(x, y) {
  scorePopups.push({ x, y, life: 1, vy: -2.2 });
}

/* アイテム取得テキストポップアップ */
function spawnTextPopup(x, y, text, color) {
  textPopups.push({ x, y, text, color, life: 1, vy: -2.5 });
}

/* アイテム取得時の放射状バースト（既存 particles[] を再利用） */
function spawnCollectBurst(x, y, color) {
  for (let i = 0; i < 10; i++) {
    const angle = (Math.PI * 2 / 10) * i;
    const spd   = Math.random() * 3.5 + 1.5;
    particles.push({
      x, y,
      vx: Math.cos(angle) * spd,
      vy: Math.sin(angle) * spd - 1.5,
      r:  Math.random() * 5 + 2,
      color,
      life: 1,
    });
  }
}

function updateDrawParticles() {
  /* 通常パーティクル */
  for (let i = particles.length - 1; i >= 0; i--) {
    const p = particles[i];
    p.x  += p.vx;
    p.y  += p.vy;
    p.vy += 0.18;
    p.life -= 0.035;
    if (p.life <= 0) { particles.splice(i, 1); continue; }

    ctx.save();
    ctx.globalAlpha = p.life;
    ctx.fillStyle = p.color;
    ctx.beginPath();
    ctx.arc(p.x, p.y, p.r * p.life, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();
  }

  /* スコアポップアップ */
  for (let i = scorePopups.length - 1; i >= 0; i--) {
    const sp = scorePopups[i];
    sp.y    += sp.vy;
    sp.life -= 0.028;
    if (sp.life <= 0) { scorePopups.splice(i, 1); continue; }

    ctx.save();
    ctx.globalAlpha = sp.life;
    ctx.font = 'bold 22px Arial';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.strokeStyle = '#c05700';
    ctx.lineWidth = 4;
    ctx.strokeText('+1', sp.x, sp.y);
    ctx.fillStyle = '#ffd700';
    ctx.fillText('+1', sp.x, sp.y);
    ctx.restore();
  }

  /* アイテム取得テキストポップアップ */
  for (let i = textPopups.length - 1; i >= 0; i--) {
    const tp = textPopups[i];
    tp.y    += tp.vy;
    tp.life -= 0.020;
    if (tp.life <= 0) { textPopups.splice(i, 1); continue; }

    ctx.save();
    ctx.globalAlpha  = tp.life;
    ctx.font         = 'bold 28px Arial';
    ctx.textAlign    = 'center';
    ctx.textBaseline = 'middle';
    ctx.strokeStyle  = 'rgba(0,0,0,0.6)';
    ctx.lineWidth    = 5;
    ctx.strokeText(tp.text, tp.x, tp.y);
    ctx.fillStyle    = tp.color;
    ctx.fillText(tp.text, tp.x, tp.y);
    ctx.restore();
  }
}

/* =====================================================
   背景描画（空・雲・地面）
   ===================================================== */
let clouds = [];

function initClouds() {
  clouds = [];
  for (let i = 0; i < 6; i++) {
    clouds.push({
      x:    Math.random() * CFG.W,
      y:    20 + Math.random() * (CFG.H * 0.38),
      size: 30 + Math.random() * 45,
      spd:  0.25 + Math.random() * 0.45,
    });
  }
}

function drawBackground() {
  /* 空のグラデーション */
  const sky = ctx.createLinearGradient(0, 0, 0, CFG.H - CFG.GROUND_H);
  sky.addColorStop(0, CFG.SKY_TOP);
  sky.addColorStop(1, CFG.SKY_BTM);
  ctx.fillStyle = sky;
  ctx.fillRect(0, 0, CFG.W, CFG.H - CFG.GROUND_H);

  /* 雲 */
  clouds.forEach(c => {
    if (state === STATE.PLAYING) {
      c.x -= c.spd;
      if (c.x + c.size * 3 < 0) {
        c.x    = CFG.W + c.size;
        c.y    = 20 + Math.random() * (CFG.H * 0.35);
        c.size = 30 + Math.random() * 45;
      }
    }
    drawCloud(c.x, c.y, c.size);
  });

  drawGround();
}

function drawCloud(x, y, s) {
  ctx.save();
  ctx.fillStyle = CFG.CLOUD_CLR;
  ctx.beginPath();
  ctx.arc(x,           y,           s * 0.52, 0, Math.PI * 2);
  ctx.arc(x + s * 0.42, y - s * 0.12, s * 0.40, 0, Math.PI * 2);
  ctx.arc(x + s * 0.82, y,           s * 0.36, 0, Math.PI * 2);
  ctx.arc(x + s * 0.42, y + s * 0.12, s * 0.44, 0, Math.PI * 2);
  ctx.fill();
  ctx.restore();
}

function drawGround() {
  const gy = CFG.H - CFG.GROUND_H;

  /* 芝生グラデーション */
  const grd = ctx.createLinearGradient(0, gy, 0, CFG.H);
  grd.addColorStop(0,   CFG.GROUND_TOP);
  grd.addColorStop(0.25, CFG.GROUND_BOT);
  grd.addColorStop(1,   '#2d6117');
  ctx.fillStyle = grd;
  ctx.fillRect(0, gy, CFG.W, CFG.GROUND_H);

  /* 境界線 */
  ctx.fillStyle = CFG.GROUND_LINE;
  ctx.fillRect(0, gy, CFG.W, 6);

  /* 地面ストライプ（スクロール） */
  bgOfs = (bgOfs + speed) % 50;
  ctx.fillStyle = 'rgba(0,0,0,0.08)';
  for (let x = -bgOfs; x < CFG.W; x += 50) {
    ctx.fillRect(x, gy + 14, 24, 5);
    ctx.fillRect(x + 28, gy + 28, 16, 4);
  }

  /* 小石の点描 */
  ctx.fillStyle = 'rgba(255,255,255,0.18)';
  for (let x = -bgOfs * 0.7; x < CFG.W; x += 70) {
    ctx.beginPath();
    ctx.ellipse(x + 10, gy + 22, 5, 3, 0.3, 0, Math.PI * 2);
    ctx.fill();
  }
}

/* =====================================================
   HUD（スコア・速度インジケーター）
   ===================================================== */
function drawHUD() {
  /* スコアパネル */
  ctx.save();
  ctx.fillStyle = 'rgba(255,255,255,0.75)';
  fillRoundRect(10, 10, 175, 60, 12);

  ctx.fillStyle = '#333';
  ctx.font = 'bold 22px Arial';
  ctx.textAlign = 'left';
  ctx.fillText(`スコア: ${Math.floor(score)}`, 18, 36);

  ctx.fillStyle = '#888';
  ctx.font = '14px Arial';
  ctx.fillText(`ベスト: ${best}`, 18, 58);

  /* 速度インジケーター（星で表示）*/
  const starFill = Math.ceil(((speed - CFG.SPEED_INIT) / (CFG.SPEED_MAX - CFG.SPEED_INIT)) * 5);
  ctx.fillStyle = 'rgba(255,255,255,0.75)';
  fillRoundRect(CFG.W - 145, 10, 135, 44, 12);

  ctx.font = '13px Arial';
  ctx.fillStyle = '#555';
  ctx.textAlign = 'right';
  ctx.fillText('スピード', CFG.W - 14, 26);
  ctx.font = '18px serif';
  const stars = '★'.repeat(Math.min(starFill + 1, 5)) + '☆'.repeat(Math.max(0, 5 - starFill - 1));
  ctx.fillStyle = '#f39c12';
  ctx.fillText(stars, CFG.W - 12, 46);

  /* 無敵残り時間インジケーター */
  if (invincibleFrames > 0) {
    const ratio    = invincibleFrames / CFG.STAR_DURATION;
    const secsLeft = Math.ceil(invincibleFrames / 60);
    const hue      = (frame * 6) % 360;

    /* 背景パネル（スコアパネルを縦に拡張） */
    ctx.fillStyle = 'rgba(255,255,255,0.75)';
    fillRoundRect(10, 72, 175, 36, 12);

    /* テキスト */
    ctx.font      = 'bold 14px Arial';
    ctx.textAlign = 'left';
    ctx.fillStyle = `hsl(${hue},100%,40%)`;
    ctx.fillText(`🌟 無敵 ${secsLeft}秒`, 18, 88);

    /* プログレスバー（残り時間を視覚化） */
    ctx.fillStyle = 'rgba(0,0,0,0.12)';
    fillRoundRect(18, 96, 148, 6, 3);
    ctx.fillStyle = `hsl(${hue},100%,55%)`;
    fillRoundRect(18, 96, 148 * ratio, 6, 3);
  }

  ctx.restore();
}

/* =====================================================
   ゲームオーバー画面

let overT  = 0;  // ゲームオーバーアニメーション用タイマー

const PANEL_TARGET_Y = CFG.H / 2 - 160;

function drawGameOver() {
  overT += 0.05;

  /* パネルのスライドイン */
  panelY += (PANEL_TARGET_Y - panelY) * 0.14;

  /* 暗幕 */
  ctx.fillStyle = 'rgba(0,0,0,0.38)';
  ctx.fillRect(0, 0, CFG.W, CFG.H);

  /* パネル */
  ctx.save();
  const pw = 420, ph = 320;
  const px = CFG.W / 2 - pw / 2;

  ctx.fillStyle = 'rgba(255,255,255,0.97)';
  fillRoundRect(px, panelY, pw, ph, 24);

  ctx.textAlign = 'center';

  /* ゲームオーバータイトル（最初だけ横振れ） */
  const shake = Math.sin(overT * 18) * Math.max(0, 1.5 - overT) * 6;
  ctx.font = 'bold 36px Arial';
  ctx.fillStyle = '#e74c3c';
  ctx.fillText('💀 ゲームオーバー！', CFG.W / 2 + shake, panelY + 58);

  /* 今回のスコア */
  ctx.font = 'bold 28px Arial';
  ctx.fillStyle = '#333';
  ctx.fillText(`スコア　${Math.floor(score)} 点`, CFG.W / 2, panelY + 108);

  /* ベストスコア・新記録判定 */
  const isNew = Math.floor(score) >= best && best > 0;
  if (isNew) {
    const sc = 1 + Math.sin(overT * 3) * 0.1;
    ctx.save();
    ctx.translate(CFG.W / 2, panelY + 148);
    ctx.scale(sc, sc);
    ctx.font = 'bold 22px Arial';
    ctx.fillStyle = '#f1c40f';
    ctx.fillText('🏆  新記録！', 0, 0);
    ctx.restore();
  }

  ctx.font = '18px Arial';
  ctx.fillStyle = '#999';
  ctx.fillText(`ベストスコア: ${best} 点`, CFG.W / 2, panelY + 180);

  /* 区切り */
  ctx.strokeStyle = '#eee';
  ctx.lineWidth = 1.5;
  ctx.beginPath();
  ctx.moveTo(px + 30, panelY + 200);
  ctx.lineTo(px + pw - 30, panelY + 200);
  ctx.stroke();

  /* リトライボタン */
  const bx = CFG.W / 2 - 125;
  const by = panelY + 216;
  const bw = 250, bh = 58;
  const bhv = Math.sin(overT * 2.2) * 3; // ボタンが少し上下する

  const bGrd = ctx.createLinearGradient(bx, by + bhv, bx, by + bh + bhv);
  bGrd.addColorStop(0, '#2ecc71');
  bGrd.addColorStop(1, '#27ae60');
  ctx.fillStyle = bGrd;
  fillRoundRect(bx, by + bhv, bw, bh, 29);

  /* ボタンの光沢 */
  ctx.fillStyle = 'rgba(255,255,255,0.25)';
  fillRoundRect(bx + 6, by + bhv + 5, bw - 12, bh * 0.42, 20);

  ctx.fillStyle = 'white';
  ctx.font = 'bold 23px Arial';
  ctx.fillText('🔄  もう一度！', CFG.W / 2, by + 36 + bhv);

  ctx.restore();

  /* リトライボタン領域をグローバルに記録（クリック判定用） */
  retryBtn = { x: bx, y: by, w: bw, h: bh };
}

let retryBtn = null; // リトライボタンの座標

/* =====================================================
   ゲームの開始・リセット
   ===================================================== */
function startGame() {
  state      = STATE.PLAYING;
  score      = 0;
  speed      = CFG.SPEED_INIT;
  frame      = 0;
  bgOfs      = 0;
  nextObsDist      = CFG.FIRST_OBS;
  lastObsType      = 'normal';  // ← リセット（最初の障害物はノーマル扱いでギャップ計算）
  obstacles        = [];
  particles        = [];
  scorePopups      = [];
  items            = [];
  textPopups       = [];
  invincibleFrames = 0;
  /* アイテムは最初の障害物より後に、一定距離置いて出現させる */
  nextItemDist     = CFG.FIRST_OBS + CFG.ITEM_MIN_GAP_F * CFG.SPEED_INIT;
  panelY           = -320;
  overT            = 0;
  retryBtn         = null;
  player.reset();
}

function triggerGameOver() {
  state = STATE.OVER;
  /* ベストスコアの更新 */
  const s = Math.floor(score);
  if (s > best) {
    best = s;
    localStorage.setItem('jtg_best', String(best));
  }
  /* 爆発パーティクル */
  spawnDeathParticles(player.x + player.w / 2, player.y + player.h / 2);
}

/* =====================================================
   入力処理
   ===================================================== */
/* スケール変換（キャンバスがCSSで縮小されている場合に対応） */
function toCanvasXY(clientX, clientY) {
  const r = canvas.getBoundingClientRect();
  return {
    x: (clientX - r.left) * (CFG.W / r.width),
    y: (clientY - r.top)  * (CFG.H / r.height),
  };
}

function handleInput(cx, cy) {
  if (state === STATE.TITLE) {
    startGame();
  } else if (state === STATE.PLAYING) {
    player.jump();
  } else if (state === STATE.OVER) {
    /* リトライボタンのヒット判定（パネルがスライドインしきってから） */
    if (retryBtn && cx >= retryBtn.x && cx <= retryBtn.x + retryBtn.w &&
        cy >= retryBtn.y && cy <= retryBtn.y + retryBtn.h) {
      startGame();
    } else if (panelY > PANEL_TARGET_Y - 20) {
      /* パネル外のタップでもリトライ */
      startGame();
    }
  }
}

document.addEventListener('keydown', e => {
  if (e.code === 'Space' || e.code === 'ArrowUp') {
    e.preventDefault();
    handleInput(0, 0);
  }
});

canvas.addEventListener('click', e => {
  const { x, y } = toCanvasXY(e.clientX, e.clientY);
  handleInput(x, y);
});

canvas.addEventListener('touchstart', e => {
  e.preventDefault();
  const t = e.touches[0];
  const { x, y } = toCanvasXY(t.clientX, t.clientY);
  handleInput(x, y);
}, { passive: false });

/* =====================================================
   ユーティリティ：角丸四角形の塗りつぶし
   ===================================================== */
function fillRoundRect(x, y, w, h, r, color) {
  if (color) ctx.fillStyle = color;
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.lineTo(x + w - r, y);
  ctx.quadraticCurveTo(x + w, y,     x + w, y + r);
  ctx.lineTo(x + w, y + h - r);
  ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
  ctx.lineTo(x + r,     y + h);
  ctx.quadraticCurveTo(x,     y + h, x,     y + h - r);
  ctx.lineTo(x,         y + r);
  ctx.quadraticCurveTo(x,     y,     x + r, y);
  ctx.closePath();
  ctx.fill();
}

/* =====================================================
   メインゲームループ
   ===================================================== */
function loop() {
  ctx.clearRect(0, 0, CFG.W, CFG.H);

  /* 背景は常に描画 */
  drawBackground();

  if (state === STATE.PLAYING) {
    frame++;

    /* スコアと速度の更新 */
    score += CFG.SCORE_RATE;
    if (speed < CFG.SPEED_MAX) speed += CFG.SPEED_INC;

    /* プレイヤーと障害物・アイテムの更新 */
    player.update();
    updateObstacles();
    updateItems();

    /* 無敵カウントダウン */
    if (invincibleFrames > 0) invincibleFrames--;

    /* 衝突判定（checkCollision内で無敵中はスキップ） */
    if (checkCollision()) triggerGameOver();
  }

  /* 描画順（後ろから前へ）:
     地面系障害物 → フライング障害物 → アイテム → プレイヤー → パーティクル → HUD */
  drawObstacles();
  drawItems();
  player.draw();

  /* パーティクルの更新・描画 */
  updateDrawParticles();

  /* 画面ごとの UI 描画 */
  if (state === STATE.PLAYING) {
    drawHUD();
  } else if (state === STATE.TITLE) {
    drawTitle();
  } else if (state === STATE.OVER) {
    drawHUD();
    drawGameOver();
  }

  requestAnimationFrame(loop);
}

/* =====================================================
   ゲームの初期化
   ===================================================== */
initClouds();
player.reset();
loop(); // ゲームループ開始
</script>
